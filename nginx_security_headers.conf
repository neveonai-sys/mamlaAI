# Security Headers for Nginx (Code Protection)
# Add these to your nginx server block

# Prevent iframe embedding (clickjacking protection)
add_header X-Frame-Options "SAMEORIGIN" always;

# Prevent MIME type sniffing
add_header X-Content-Type-Options "nosniff" always;

# Enable XSS protection
add_header X-XSS-Protection "1; mode=block" always;

# Disable browser caching for index.html (always get latest)
location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    add_header Pragma "no-cache";
    add_header Expires "0";
}

# Cache static assets aggressively
location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# Prevent access to source map files (if any accidentally created)
location ~* \.map$ {
    deny all;
    return 404;
}

# Prevent access to .env and config files
location ~* \.(env|json|lock)$ {
    deny all;
    return 404;
}

# Content Security Policy (prevents inline scripts from attackers)
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://mamla.ai wss://mamla.ai; frame-ancestors 'self';" always;

# Referrer Policy (don't leak URLs to external sites)
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Permissions Policy (disable unused browser features)
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
