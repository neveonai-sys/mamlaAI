server {
    server_name mamla.ai www.mamla.ai;

    # Root directory for static files
    root /home/pronoys/products/sessioned_AiAdalat/Adalatai_ground_zero/frontend_webpack/dist;
    index index.html;

    # =========================
    # Security Headers (RESPONSE ONLY)
    # =========================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Prevent access to source maps (extra security)
    location ~* \.map$ {
        deny all;
        return 404;
    }

    # Prevent access to config files
    location ~* \.(env|json|lock)$ {
        deny all;
        return 404;
    }

    # =========================
    # Static Assets (Aggressive Caching)
    # =========================
    location ~* ^/static/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        
        # Enable gzip compression
        gzip on;
        gzip_vary on;
        gzip_types text/css application/javascript image/svg+xml;
        
        # Security headers for static files
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # =========================
    # React Frontend (SPA)
    # =========================
    location / {
        # Try to serve file directly, fallback to index.html (SPA routing)
        try_files $uri $uri/ /index.html;
        
        # Don't cache index.html (always get latest)
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }

    # =========================
    # Django Backend API
    # =========================
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
        
        # Timeouts for long AI processing
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
    }

    # =========================
    # Django Admin (if needed)
    # =========================
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================
    # SSL
    # =========================
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/mamla.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mamla.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name mamla.ai www.mamla.ai;
    return 301 https://$host$request_uri;
}
