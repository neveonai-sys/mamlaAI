id: 001_rent_arrears_notice

# The benchmark's headline failure. Mamla scored 3/10, Jhana 7/10.
# Reviewer findings this fixture encodes:
#   - BNSS (criminal procedure) cited to threaten eviction in a civil rent dispute
#   - no numbered "That ..." recitals, no NOW THEREFORE, no TAKE NOTICE
#   - no advocate letterhead/reference block, no "Yours faithfully / Counsel for"
#   - headings read "TITLE OF THE NOTICE" / "SENDER'S DETAILS" like a form, not a notice
#   - eviction threatened though the instructions asked only for payment in 15 days

prompt: |
  Draft a legal notice from my client [Karuna Anupam] to [Akriti Swaroop]
  regarding the following, Karuna Anupam let out her residential apartment to
  Akriti Swaroop under a lease agreement dated 15 January 2026 at a monthly
  rent of Rs 32,000. Akriti has failed to pay rent for May, June, and July
  2026, resulting in outstanding dues of Rs 96,000, despite repeated
  reminders. The continued non-payment constitutes a breach of the lease
  agreement. Karuna seeks a legal notice demanding payment of the outstanding
  rent within 15 days, failing which appropriate legal proceedings will be
  initiated.

expect:
  doc_type: legal_notice.rent_arrears
  branch: civil

  # Indian legal-notice conventions. Their absence is defect #2.
  # Nested lists are accepted alternatives — the convention admits variants
  # (a demand opening "NOW THEREFORE, I hereby call upon you" and one opening
  # "I, therefore, call upon you" are both proper). Canonical form first.
  must_contain:
    - "That "
    - ["NOW THEREFORE", "call upon you"]
    - ["TAKE NOTICE", "constrained to initiate"]
    - ["Yours faithfully", "Yours truly"]
    - "Advocate"

  must_contain_section_names:
    - "RECITALS"
    - "NOW THEREFORE"
    - "TAKE NOTICE"

  # Form-like headings the reviewers called out by name.
  must_not_contain:
    - "TITLE OF THE NOTICE"
    - "SENDER'S DETAILS"
    - "TITLE OF THE SUIT"
    - "CLOSING STATEMENT"

  # Defect #1: a landlord-tenant rent dispute is civil. No penal code belongs here.
  forbid_penal_statutes: true

  # The instructions asked for payment in 15 days, failing which "appropriate
  # legal proceedings". Naming eviction as the specific remedy was scope creep
  # the reviewers flagged; tying it to BNSS was the substantive error.
  must_not_match:
    - "(?i)evict\\w*[^.]{0,80}(BNSS|Bharatiya Nagarik|criminal)"

  literals_from_prompt:
    - "96,000"
    - "32,000"
    - "15 days"

  min_sections: 7
  require_assumptions: true
  require_drafting_notes: true

notes: |
  Baseline (gpt-4o-mini, pre-playbook): expected to fail statute, format and
  compliance outright. Phase 1 must take statute and format to full marks.
